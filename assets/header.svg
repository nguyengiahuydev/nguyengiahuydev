<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="850" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Text Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background Base with subtle border -->
  <rect x="1" y="1" width="848" height="218" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Background Ambient Glow Orbs -->
  <circle cx="750" cy="40" r="80" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="100" cy="180" r="90" fill="#818cf8" fill-opacity="0.07" filter="url(#glow)" />

  <!-- Terminal Window Controls Bar -->
  <circle cx="28" cy="24" r="5" fill="#ef4444" />
  <circle cx="44" cy="24" r="5" fill="#f59e0b" />
  <circle cx="60" cy="24" r="5" fill="#10b981" />

  <!-- Monospace Path Prompt -->
  <text x="82" y="28" fill="#64748b" font-family="'Fira Code', SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="500">nguyengiahuydev ~/workspace</text>

  <!-- Status Badge (Top Right) -->
  <g transform="translate(668, 13)">
    <rect width="154" height="24" rx="12" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#34d399" />
    <text x="26" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Open for Projects</text>
  </g>

  <!-- Divider Line -->
  <line x1="20" y1="42" x2="830" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Main Hero Content -->
  <!-- Name -->
  <text x="32" y="88" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Nguyễn Gia Huy</text>

  <!-- Role Title -->
  <text x="32" y="118" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Software Developer • Full-stack &amp; Automation Systems</text>

  <!-- Description / Bio -->
  <text x="32" y="146" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">Specialized in scalable web platforms, custom proxy architectures, and developer tooling.</text>

  <!-- Technical Tags (SVGs / Badges) -->
  <g transform="translate(32, 168)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="94" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#38bdf8" />
    <text x="22" y="16" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11" font-weight="500">TypeScript</text>

    <!-- Tag 2 -->
    <rect x="104" y="0" width="76" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="116" cy="12" r="3" fill="#68a063" />
    <text x="126" y="16" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11" font-weight="500">Node.js</text>

    <!-- Tag 3 -->
    <rect x="190" y="0" width="72" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="202" cy="12" r="3" fill="#3572A5" />
    <text x="212" y="16" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11" font-weight="500">Python</text>

    <!-- Tag 4 -->
    <rect x="272" y="0" width="58" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="284" cy="12" r="3" fill="#4F5D95" />
    <text x="294" y="16" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11" font-weight="500">PHP</text>

    <!-- Tag 5 -->
    <rect x="340" y="0" width="102" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="352" cy="12" r="3" fill="#a855f7" />
    <text x="362" y="16" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11" font-weight="500">Automation</text>

    <!-- Tag 6 -->
    <rect x="452" y="0" width="118" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="464" cy="12" r="3" fill="#ec4899" />
    <text x="474" y="16" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11" font-weight="500">API Architecture</text>
  </g>
</svg>
